apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
    - name: apps-monitoring
  interval: 30m
  wait: true
  timeout: 5m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators/uptime-kuma
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-monitors
  namespace: flux-system
spec:
  dependsOn:
    - name: uptime-kuma-operator
  interval: 10m
  wait: true
  timeout: 5m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/monitoring/uptime-kuma/monitors
