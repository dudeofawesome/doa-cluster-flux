apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-operator
  namespace: flux-system
spec:
  # Prepared only: supply credentials and resolve the upstream v2 issues first.
  suspend: true
  dependsOn:
    - name: sources
    - name: apps-monitoring
  interval: 30m
  wait: true
  timeout: 5m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators/uptime-kuma
  decryption:
    provider: sops
    secretRef:
      name: sops-age
