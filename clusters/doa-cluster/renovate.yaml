apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: apps-base
  interval: 1h
  wait: true
  timeout: 5m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators/renovate
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-jobs
  namespace: flux-system
spec:
  dependsOn:
    - name: renovate-operator
  interval: 10m
  wait: true
  timeout: 5m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/automation/renovate
