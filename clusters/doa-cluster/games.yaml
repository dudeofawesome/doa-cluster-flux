---
apiVersion: v1
kind: Namespace
metadata:
  name: games
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-games
  namespace: games
spec:
  dependsOn:
    - name: apps-base
      namespace: flux-system
  interval: 10m0s
  wait: true
  # First start downloads the dedicated server from Steam.
  timeout: 35m0s
  retryInterval: 2m0s
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./apps/games
  decryption:
    provider: sops
    secretRef:
      name: sops-age
