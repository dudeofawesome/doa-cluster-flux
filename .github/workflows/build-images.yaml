name: Build images

on:
  push:
    branches: [main]
    paths:
      - images/cups/**
      - images/keycloak/**
      - .github/workflows/build-images.yaml
  schedule:
    # Weekly on Sundays at 04:00 UTC — picks up base image security patches.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      cups_version:
        description: 'CUPS version override (leave empty to use Containerfile default)'
        required: false
        type: string
      keycloak_version:
        description: 'Keycloak version override (leave empty to use Containerfile default)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cups
            platforms: linux/amd64,linux/arm64
            version_arg: CUPS_VERSION
            version_override: ${{ inputs.cups_version }}
          - image: keycloak
            platforms: linux/amd64
            version_arg: KC_VERSION
            version_override: ${{ inputs.keycloak_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from Containerfile
        id: version
        env:
          IMAGE: ${{ matrix.image }}
          VERSION_ARG: ${{ matrix.version_arg }}
          VERSION_OVERRIDE: ${{ matrix.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            image_ref="$VERSION_OVERRIDE"
          else
            image_ref=$(grep -oP "^ARG ${VERSION_ARG}=\K.*" "images/${IMAGE}/Containerfile")
          fi

          if [ -z "$image_ref" ]; then
            echo "Unable to determine ${IMAGE} version from ${VERSION_ARG}" >&2
            exit 1
          fi

          # Docker tags cannot include a digest, so publish using the version part only.
          image_tag="${image_ref%%@*}"

          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: matrix.image == 'cups'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Containerfile
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: true
          build-args: |
            ${{ matrix.version_arg }}=${{ steps.version.outputs.image_ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.image_tag }}-${{ github.run_id }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
