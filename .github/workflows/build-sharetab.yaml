name: Build ShareTab

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-sharetab.yaml
      - images/sharetab/**
      - scripts/test-sharetab-entrypoint.py
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sharetab.yaml
      - images/sharetab/**
      - scripts/test-sharetab-entrypoint.py
  workflow_dispatch:

env:
  SHARETAB_COMMIT: 2e43fdb5c36e6aad4a0595f5261ac2368d6b050a
  IMAGE_REVISION: app1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sw-carlos-cristobal/sharetab
          ref: ${{ env.SHARETAB_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Apply local container patches
        run: |
          for patch in "$GITHUB_WORKSPACE"/images/sharetab/patches/*.patch; do
            echo "Applying $(basename "$patch")"
            git -C upstream apply "$patch"
          done
      - name: Test patched startup
        run: python3 scripts/test-sharetab-entrypoint.py upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          build-args: |
            COMMIT_SHA=${{ env.SHARETAB_COMMIT }}
          tags: ghcr.io/${{ github.repository_owner }}/sharetab:${{ env.SHARETAB_COMMIT }}-${{ env.IMAGE_REVISION }}
          cache-from: type=gha,scope=sharetab
          cache-to: type=gha,mode=max,scope=sharetab
