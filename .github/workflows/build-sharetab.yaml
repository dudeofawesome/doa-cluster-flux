name: Build ShareTab

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-sharetab.yaml
      - images/sharetab/**
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sharetab.yaml
      - images/sharetab/**
  workflow_dispatch:

env:
  SHARETAB_COMMIT: 4e776d64abd3283f1b3142a7da9bef4b2db8ad84
  IMAGE_REVISION: app1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sw-carlos-cristobal/sharetab
          ref: ${{ env.SHARETAB_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Add application-only entrypoint
        run: cp images/sharetab/entrypoint.sh upstream/docker/app-entrypoint.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          file: images/sharetab/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          build-args: |
            COMMIT_SHA=${{ env.SHARETAB_COMMIT }}
          tags: ghcr.io/${{ github.repository_owner }}/sharetab:${{ env.SHARETAB_COMMIT }}-${{ env.IMAGE_REVISION }}
          cache-from: type=gha,scope=sharetab
          cache-to: type=gha,mode=max,scope=sharetab
