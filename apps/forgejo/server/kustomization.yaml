apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
labels:
  - pairs:
      app: forgejo
    includeSelectors: false

resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - config.yaml
  - secrets.yaml
  - oidc/secrets.yaml
  - runner-registration/secrets.yaml
  - oidc-client.yaml
  - deployment.yaml
  - ingress.yaml
  - network-policy.yaml

configMapGenerator:
  - name: configuration
    files:
      - app.ini
