---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configuration
  namespace: forgejo
data:
  app.ini: |
    APP_NAME = Forgejo
    RUN_MODE = prod
    RUN_USER = git

    [repository]
    ROOT = /var/lib/gitea/data/forgejo-repositories
    DEFAULT_BRANCH = main
    DEFAULT_PRIVATE = private
    DEFAULT_REPO_UNITS = repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.actions
    DISABLED_REPO_UNITS = repo.packages
    ENABLE_PUSH_CREATE_USER = false
    ENABLE_PUSH_CREATE_ORG = false

    [repository.pull-request]
    DEFAULT_MERGE_STYLE = merge

    [repository.upload]
    FILE_MAX_SIZE = 100

    [server]
    PROTOCOL = http
    DOMAIN = git.orleans.io
    ROOT_URL = https://git.orleans.io/
    HTTP_ADDR = 0.0.0.0
    HTTP_PORT = 3000
    APP_DATA_PATH = /var/lib/gitea/data
    START_SSH_SERVER = true
    BUILTIN_SSH_SERVER_USER = git
    SSH_DOMAIN = git.orleans.io
    SSH_PORT = 22
    SSH_LISTEN_HOST = 0.0.0.0
    SSH_LISTEN_PORT = 2222
    SSH_EXPOSE_ANONYMOUS = true
    LFS_START_SERVER = true
    LFS_MAX_FILE_SIZE = 1073741824
    OFFLINE_MODE = true

    [database]
    DB_TYPE = postgres
    HOST = postgres-rw.forgejo.svc.cluster.local:5432
    NAME = forgejo
    SSL_MODE = disable

    [security]
    INSTALL_LOCK = true
    LOGIN_REMEMBER_DAYS = 7

    [service]
    DISABLE_REGISTRATION = true
    SHOW_REGISTRATION_BUTTON = false
    ALLOW_ONLY_EXTERNAL_REGISTRATION = true
    REGISTER_EMAIL_CONFIRM = false
    ENABLE_NOTIFY_MAIL = false
    DEFAULT_ALLOW_CREATE_ORGANIZATION = false
    DEFAULT_USER_VISIBILITY = limited
    DEFAULT_ORG_VISIBILITY = limited
    NO_REPLY_ADDRESS = noreply.git.orleans.io

    [service.explore]
    DISABLE_USERS_PAGE = true

    [admin]
    DISABLE_REGULAR_ORG_CREATION = true
    DEFAULT_EMAIL_NOTIFICATIONS = disabled
    EXTERNAL_USER_DISABLE_FEATURES = deletion,manage_password

    [oauth2_client]
    ACCOUNT_LINKING = disabled
    ENABLE_AUTO_REGISTRATION = true
    REGISTER_EMAIL_CONFIRM = false

    [openid]
    ENABLE_OPENID_SIGNIN = false
    ENABLE_OPENID_SIGNUP = false

    [indexer]
    REPO_INDEXER_ENABLED = true

    [actions]
    ENABLED = true
    DEFAULT_ACTIONS_URL = https://data.forgejo.org
    LOG_RETENTION_DAYS = 90
    ARTIFACT_RETENTION_DAYS = 30
    ENDLESS_TASK_TIMEOUT = 3h

    [attachment]
    ENABLED = true
    MAX_SIZE = 100

    [packages]
    ENABLED = false

    [quota]
    ENABLED = true

    [quota.default]
    TOTAL = 5G

    [webhook]
    ALLOWED_HOST_LIST = external
    SKIP_TLS_VERIFY = false

    [migrations]
    ALLOW_LOCALNETWORKS = false

    [federation]
    ENABLED = false

    [mailer]
    ENABLED = false

    [metrics]
    ENABLED = false

    [time]
    DEFAULT_UI_LOCATION = UTC

    [log]
    MODE = console
    LEVEL = Info

    [other]
    ENABLE_SITEMAP = false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap
  namespace: forgejo
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    forgejo migrate

    if ! forgejo admin user list | awk '{print $2}' | grep -qx forgejo-admin; then
      forgejo admin user create \
        --username forgejo-admin \
        --password "$FORGEJO_ADMIN_PASSWORD" \
        --email forgejo-admin@git.orleans.io \
        --admin \
        --must-change-password=false
    else
      forgejo admin user change-password \
        --username forgejo-admin \
        --password "$FORGEJO_ADMIN_PASSWORD" \
        --must-change-password=false
    fi

    auth_id="$(
      forgejo admin auth list \
        | awk '$2 == "Keycloak" {print $1; exit}'
    )"

    if [ -n "$auth_id" ]; then
      auth_command="update-oauth --id $auth_id"
    else
      auth_command='add-oauth'
    fi

    # shellcheck disable=SC2086
    forgejo admin auth $auth_command \
      --name Keycloak \
      --provider openidConnect \
      --key forgejo \
      --secret "$OIDC_CLIENT_SECRET" \
      --auto-discover-url \
        https://auth.orleans.io/realms/sequoia/.well-known/openid-configuration \
      --scopes openid \
      --scopes profile \
      --scopes email \
      --required-claim-name groups \
      --required-claim-value /Users \
      --group-claim-name groups \
      --admin-group /Admins \
      --allow-username-change=false \
      --skip-local-2fa

    for secret_file in /run/runner-secrets/forgejo-runner-*; do
      runner_name="$(basename "$secret_file")"
      forgejo forgejo-cli actions register \
        --name "$runner_name" \
        --secret-file "$secret_file" \
        --labels docker,ubuntu-latest,self-hosted \
        --version 13.1.0
    done
