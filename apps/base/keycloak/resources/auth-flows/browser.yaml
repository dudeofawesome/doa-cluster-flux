---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakAuthFlow
metadata:
  name: browser-sequoia
  namespace: keycloak
spec:
  alias: browser - Sequoia
  description: A customized browser flow for the Sequoia realm
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  builtIn: false
  topLevel: true
  providerId: basic-flow
  authenticationExecutions:
    - alias: Cookie
      authenticator: auth-cookie
      requirement: ALTERNATIVE
      priority: 10
    - alias: Identity Provider Redirector
      authenticator: identity-provider-redirector
      requirement: ALTERNATIVE
      priority: 20
    - alias: traditional-login
      authenticatorFlow: true
      requirement: ALTERNATIVE
      priority: 40
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakAuthFlow
metadata:
  name: traditional-login
  namespace: keycloak
spec:
  alias: traditional-login
  description: Password or built-in passkey login
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  builtIn: false
  topLevel: false
  parentName: browser - Sequoia
  childType: basic-flow
  childRequirement: ALTERNATIVE
  providerId: basic-flow
  authenticationExecutions:
    - alias: traditional-login-forms
      authenticatorFlow: true
      requirement: REQUIRED
      priority: 10
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakAuthFlow
metadata:
  name: traditional-login-forms
  namespace: keycloak
spec:
  alias: traditional-login-forms
  description: Password or built-in passkey login, with conditional OTP
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  builtIn: false
  topLevel: false
  parentName: traditional-login
  childType: basic-flow
  childRequirement: REQUIRED
  providerId: basic-flow
  authenticationExecutions:
    - alias: Username Password Form
      # Also offers passkey autofill and a button when the realm enables passkeys.
      authenticator: auth-username-password-form
      requirement: REQUIRED
      priority: 10
    - alias: traditional-login-otp
      authenticatorFlow: true
      requirement: CONDITIONAL
      priority: 20
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakAuthFlow
metadata:
  name: traditional-login-otp
  namespace: keycloak
spec:
  alias: traditional-login-otp
  description: Require OTP for password login when the user has configured it
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  builtIn: false
  topLevel: false
  parentName: traditional-login-forms
  childType: basic-flow
  childRequirement: CONDITIONAL
  providerId: basic-flow
  authenticationExecutions:
    - alias: Condition - User Configured
      authenticator: conditional-user-configured
      requirement: REQUIRED
      priority: 10
    - alias: Condition - credential
      authenticator: conditional-credential
      requirement: REQUIRED
      priority: 20
      authenticatorConfig:
        alias: traditional-login-skip-otp-after-passkey
        config:
          credentials: webauthn-passwordless
          included: 'false'
    - alias: OTP Form
      authenticator: auth-otp-form
      requirement: REQUIRED
      priority: 30
