---
# Operator v1.35.0 does not expose webAuthnPolicyPasswordlessPasskeysEnabled.
# Keep this one-time realm update in Git until the operator supports the field.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-enable-passkeys
  namespace: keycloak
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: enable-passkeys
          image: 'ghcr.io/dudeofawesome/keycloak:26.8.1@sha256:9519996ec3fa6406b2068e3ad19cc5111c1bd15ccef37af35618ec8eb3915881'
          command: ['/bin/bash', '-euc']
          args:
            - |
              /opt/keycloak/bin/kcadm.sh update realms/sequoia \
                --no-config \
                --server https://auth.orleans.io \
                --realm master \
                --user "$KEYCLOAK_ADMIN" \
                --password "$KEYCLOAK_ADMIN_PASSWORD" \
                -n \
                --set webAuthnPolicyPasswordlessPasskeysEnabled=true
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
