---
apiVersion: v1.edp.epam.com/v1alpha1
kind: ClusterKeycloakRealm
metadata:
  name: sequoia
  namespace: keycloak
spec:
  realmName: sequoia
  displayName: 'Sequoia'
  clusterKeycloakRef: keycloak
  realmEventConfig:
    adminEventsEnabled: true
    adminEventsDetailsEnabled: false
    adminEventsExpiration: 31536000 # 365 days
    eventsEnabled: true
    eventsExpiration: 2592000 # 30 days
    enabledEventTypes:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - UPDATE_CREDENTIAL
      - UPDATE_CREDENTIAL_ERROR
      - REMOVE_CREDENTIAL
      - REMOVE_CREDENTIAL_ERROR
      - IMPERSONATE
      - IMPERSONATE_ERROR
      - CODE_TO_TOKEN_ERROR
      - REFRESH_TOKEN_ERROR
      - CLIENT_LOGIN_ERROR
    eventsListeners:
      - jboss-logging
  sessions:
    ssoSessionSettings:
      idleTimeout: 604800 # 7 days
      maxLifespan: 2592000 # 30 days
  passwordPolicy:
    - type: notUsername
      value: 'true'
    - type: notContainsUsername
      value: 'true'
    - type: notEmail
      value: 'true'
    - type: length
      value: '15'
  authenticationFlows:
    browserFlow: browser - Sequoia
  userProfileConfig:
    attributes:
      - name: picture
        displayName: Profile Picture
        validations:
          uri:
            allowedSchemes:
              sliceVal: ['https']
            allowFragment:
              stringVal: 'true'
            requireValidUrl:
              stringVal: 'true'
        permissions:
          view: ['admin', 'user']
          edit: ['admin', 'user']
        annotations:
          inputType: html5-url
          inputTypePlaceholder: image URL
