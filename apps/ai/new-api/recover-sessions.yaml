# One-time recovery for sessions orphaned by the pre-refresh reconciler.
# The fixed cutoff makes reruns safe for sessions created after recovery.
apiVersion: batch/v1
kind: Job
metadata:
  name: new-api-recover-sessions-20261015
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recover-sessions
          image: ghcr.io/cloudnative-pg/postgresql:17.5
          command: ['psql']
          args:
            - --no-psqlrc
            - --dbname=$(DATABASE_URI)
            - --set=ON_ERROR_STOP=1
            - --command
            - |
              SET statement_timeout = '30s';
              UPDATE user_sessions
              SET status = 'revoked',
                  revoked_at = EXTRACT(EPOCH FROM CURRENT_TIMESTAMP)::bigint,
                  revoked_reason = 'orphaned_reconciler_recovery',
                  version = version + 1
              WHERE user_id = (SELECT id FROM users WHERE username = 'cluster-root')
                AND status = 'active'
                AND ip = '127.0.0.1'
                AND user_agent IN ('Python-urllib/3.13', 'Python-urllib/3.14')
                AND created_at < EXTRACT(EPOCH FROM TIMESTAMPTZ '2026-10-15 20:00:00+00');
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
