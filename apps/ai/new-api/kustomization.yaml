apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-api
resources:
  - namespace.yaml
  - service-account.yaml
  - database.yaml
  - deployment.yaml
  - ingress.yaml
  - network-policy.yaml
  - oidc-client.yaml
  - secrets.yaml
configMapGenerator:
  - name: new-api-config
    files:
      - gateway.json
      - reconcile.py
