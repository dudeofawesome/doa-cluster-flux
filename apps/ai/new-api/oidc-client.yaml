apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: inference
spec:
  clientId: inference
  name: Inference
  description: New API key portal at inference.orleans.io
  protocol: openid-connect
  enabled: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccess: false
  public: false
  consentRequired: false
  fullScopeAllowed: false
  bearerOnly: false
  clientAuthenticatorType: client-secret
  authorizationServicesEnabled: false
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  secret: '$new-api:client_secret'
  webUrl: https://inference.orleans.io
  redirectUris:
    - https://inference.orleans.io/oauth/sequoia
  webOrigins:
    - https://inference.orleans.io
  defaultClientScopes:
    - profile
    - email
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        access.token.claim: 'true'
        claim.name: groups
        full.path: 'true'
        id.token.claim: 'true'
        userinfo.token.claim: 'true'
  attributes:
    post.logout.redirect.uris: https://inference.orleans.io
---
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: inference-users
spec:
  name: inference-users
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
