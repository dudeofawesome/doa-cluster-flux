apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: dungeon-scriber
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Provision on the GPU node now, so the volume never lands on another
    #   node and Flux's health check does not wait for a first consumer.
    volume.kubernetes.io/selected-node: kings-canyon
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # A budget for base models and adapters, not a reservation: local-path
      #   neither reserves nor enforces PVC sizes.
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work
  namespace: dungeon-scriber
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    volume.kubernetes.io/selected-node: kings-canyon
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Budget for datasets, checkpoints and outputs; also not enforced.
      storage: 150Gi
