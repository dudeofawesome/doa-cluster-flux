apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: dungeon-scriber
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # Provision on the GPU node now, so the volume never lands on another
    #   node and Flux's health check does not wait for a first consumer.
    volume.kubernetes.io/selected-node: kings-canyon
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Intended budget for base models and adapters; local-path does not
      #   enforce a disk quota.
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work
  namespace: dungeon-scriber
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    volume.kubernetes.io/selected-node: kings-canyon
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # Datasets, checkpoints and outputs; not enforced by local-path either.
      storage: 300Gi
