kind: Pod
metadata:
  name: rtx3090-debug-container-pinned
  namespace: dungeon-scriber
  annotations:
    test.gpu-admission/expect: allow
    test.gpu-admission/describe: A debug container that pins the 3090 is fine.
spec:
