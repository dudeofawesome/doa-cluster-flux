        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      resources:
        limits: { devic.es/rtx3090: '1' }
  ephemeralContainers:
    - name: debug
      image: docker.io/library/busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
---
