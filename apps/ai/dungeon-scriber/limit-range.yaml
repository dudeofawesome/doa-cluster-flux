apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: dungeon-scriber
spec:
  limits:
    # Defaults for containers without resources; GPU jobs set their own.
    #   devic.es/rtx3090 is never defaulted, so only explicit requests get it.
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
      default:
        cpu: '2'
        memory: 4Gi
        ephemeral-storage: 8Gi
      max:
        cpu: '16'
        memory: 32Gi
