apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wyoming
labels:
  - pairs:
      app: wyoming
    # Preserve cross-namespace NetworkPolicy peer selectors (CoreDNS and HA).
    includeSelectors: false
resources:
  - namespace.yaml
  - deployment.yaml
  - storage.yaml
  - service.yaml
  - network-policy.yaml
