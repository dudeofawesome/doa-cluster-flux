apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wyoming
labels:
  - pairs:
      app: wyoming
    # Preserve cross-namespace NetworkPolicy peer selectors (CoreDNS and HA).
    includeSelectors: false
configMapGenerator:
  - name: parakeet-startup
    files:
      - run.py=parakeet/run.py
  - name: piper-startup
    files:
      - run.py=piper/run.py
resources:
  - namespace.yaml
  - network-policy.yaml
  - parakeet/deployment.yaml
  - parakeet/storage.yaml
  - parakeet/service.yaml
  - piper/deployment.yaml
  - piper/storage.yaml
  - piper/service.yaml
  - whisper/deployment.yaml
  - whisper/storage.yaml
  - whisper/service.yaml
