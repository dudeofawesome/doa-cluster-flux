apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wyoming
spec:
  podSelector:
    matchLabels:
      app: wyoming
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-assistant
          podSelector:
            matchLabels:
              app: home-assistant
              component: app
        # HA uses hostNetwork. Allow current node InternalIPs for rescheduling.
        # Host processes and other hostNetwork pods share this trust boundary.
        - ipBlock:
            cidr: 100.126.122.45/32 # balsam-lake
        - ipBlock:
            cidr: 100.109.202.118/32 # capitol-reef
        - ipBlock:
            cidr: 100.120.122.31/32 # kings-canyon
      ports:
        - port: 10200
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Hugging Face model downloads and their HTTPS redirects/CDN endpoints.
    - ports:
        - port: 443
          protocol: TCP
