apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming
      component: whisper
  template:
    metadata:
      labels:
        app: wyoming
        component: whisper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          image: rhasspy/wyoming-whisper:3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
          args:
            - --stt-library
            - faster-whisper
            - --model
            - base.en
            - --language
            - en
            - --device
            - cpu
            - --compute-type
            - int8
            - --cpu-threads
            - '2'
            - --download-dir
            - /data
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: OMP_NUM_THREADS
              value: '2'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: wyoming
              containerPort: 10300
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          # First startup downloads the model; transcription can block the loop.
          startupProbe:
            exec: &health-check
              command:
                - /usr/src/.venv/bin/python3
                - -m
                - wyoming_faster_whisper.health_check
                - --timeout
                - '15'
            timeoutSeconds: 20
            periodSeconds: 10
            failureThreshold: 48
          readinessProbe:
            exec: *health-check
            timeoutSeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            exec: *health-check
            timeoutSeconds: 20
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
