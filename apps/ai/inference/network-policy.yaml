apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-servers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kubeai
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeai-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kubeai
              app.kubernetes.io/instance: kubeai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
