# Manual benchmark client; deliberately excluded from kustomization.yaml.
# Holds no GPU: requests go through KubeAI, like real traffic.
apiVersion: v1
kind: Pod
metadata:
  name: model-benchmark
  namespace: inference
  labels:
    inference.orleans.io/benchmark-client: 'true'
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: kings-canyon
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: ghcr.io/syv-ai/hyperqwen:sha-6ab9bd0@sha256:f706b092aabb156c23fe98c312ba7912fb8dbc0c107d4f152382113e33762f1c
      command: [sleep, infinity]
      env:
        - name: PATH
          value: /app/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: '2'
          memory: 2Gi
        limits:
          memory: 8Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: inference-models
