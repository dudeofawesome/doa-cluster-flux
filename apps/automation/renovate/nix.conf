extra-experimental-features = nix-command flakes
# Explicit store parameters override Containerbase's NIX_* directory exports.
store = local?store=/nix/store&real=/nix/store&state=/nix/var/nix&log=/nix/var/log/nix
# Binary-cache stores independently default to Containerbase's NIX_STORE_DIR too.
substituters = https://cache.nixos.org?store=/nix/store
# Avoid fsGroup-mounted volumes: inherited setgid bits make unzip fail Nix syscall filtering.
build-dir = /var/tmp
# Builds run inside an unprivileged Kubernetes container.
sandbox = false
