apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github
spec:
  schedule: '0 * * * *'
  provider:
    name: github
  # No discovery filters: the GitHub App installation controls repository scope.
  image: ghcr.io/renovatebot/renovate:44.197.1@sha256:dd474cd803d90545e9799cf96f7909670d786fd85220ea4b72f882744985cf3a
  parallelism: 2
  extraEnv:
    # Include tool installation output when artifact generation fails.
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_HOST_RULES
      valueFrom:
        secretKeyRef:
          name: renovate-host-credentials
          key: RENOVATE_HOST_RULES
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "allowedCommands": [
          "^node scripts/renovate-nix-packages-update[.]mjs$",
          "^node scripts/renovate-avahi2dns-checksum[.]mjs$",
          "^node scripts/renovate-helm-source-refresh[.]mjs$"
        ],
        "customEnvVariables": {
          "NIX_USER_CONF_FILES": "/etc/renovate-nix/nix.conf"
        }
      }
  extraVolumes:
    - name: nix-store
      emptyDir:
        sizeLimit: 10Gi
    - name: containerbase-tmp
      emptyDir: {}
    - name: nix-config
      configMap:
        name: renovate-nix-config
  extraVolumeMounts:
    # Keep the standard store prefix for binary-cache compatibility.
    - name: nix-store
      mountPath: /nix
    # The pod's fsGroup makes Containerbase's initialization directory writable.
    - name: containerbase-tmp
      mountPath: /tmp/containerbase
    # ~/.config links into Containerbase's cache; mounting there creates root-owned parents.
    # NIX_USER_CONF_FILES selects this config even when Containerbase sets NIX_CONF_DIR.
    - name: nix-config
      mountPath: /etc/renovate-nix
      readOnly: true
  githubAppReference:
    secretName: github-app-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  serviceAccount:
    automountServiceAccountToken: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: github-webhook
        key: secret
    sync:
      enabled: false
