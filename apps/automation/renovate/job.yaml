apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github
spec:
  schedule: '0 * * * *'
  provider:
    name: github
  # No discovery filters: the GitHub App installation controls repository scope.
  image: ghcr.io/renovatebot/renovate:44.171.1@sha256:6fffb26e606488bf674f2d9400fc3fc6b2a0243a0c22a4a4d22e422ee44934c5
  parallelism: 2
  extraEnv:
    # Include tool installation output when artifact generation fails.
    - name: LOG_LEVEL
      value: debug
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "allowedCommands": ["^node scripts/renovate-nix-packages-update[.]mjs$"]
      }
  extraVolumes:
    - name: containerbase-tmp
      emptyDir: {}
    - name: nix-config
      configMap:
        name: renovate-nix-config
  extraVolumeMounts:
    # The pod's fsGroup makes Containerbase's initialization directory writable.
    - name: containerbase-tmp
      mountPath: /tmp/containerbase
    # Containerbase overrides NIX_CONF_DIR; use the user's configuration instead.
    - name: nix-config
      mountPath: /home/ubuntu/.config/nix/nix.conf
      subPath: nix.conf
      readOnly: true
  githubAppReference:
    secretName: github-app-credentials
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  serviceAccount:
    automountServiceAccountToken: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: github-webhook
        key: secret
    sync:
      enabled: false
