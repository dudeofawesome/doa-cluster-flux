apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: dawarich
spec:
  clientId: dawarich
  name: Dawarich
  description: Location history at dawarich.orleans.io
  protocol: openid-connect
  enabled: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccess: false
  public: false
  consentRequired: false
  fullScopeAllowed: false
  bearerOnly: false
  clientAuthenticatorType: client-secret
  authorizationServicesEnabled: false
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  secret: '$dawarich:OIDC_CLIENT_SECRET'
  webUrl: https://dawarich.orleans.io
  redirectUris:
    - https://dawarich.orleans.io/users/auth/openid_connect/callback
  webOrigins:
    - https://dawarich.orleans.io
  defaultClientScopes:
    - profile
    - email
  attributes:
    pkce.code.challenge.method: S256
