apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dawarich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dawarich.orleans.io`)
      kind: Rule
      services:
        - name: dawarich
          port: 3000
  tls:
    secretName: wildcard-orleans-io
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich
spec:
  selector:
    component: app
  ports:
    - name: http
      port: 3000
      targetPort: http
