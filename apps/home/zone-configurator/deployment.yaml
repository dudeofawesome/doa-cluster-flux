apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-configurator
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      containers:
        - name: zone-configurator
          image: docker.io/everythingsmarthome/everything-presence-mmwave-configurator:2.2.4@sha256:f011a104e3f074befaf60a15b87383fd41b532b747050e9274d7d07274ba1a0b
          imagePullPolicy: IfNotPresent
          env:
            - name: HA_BASE_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            - name: HA_LONG_LIVED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zone-configurator
                  key: ha_long_lived_token
            - name: FIRMWARE_LAN_PORT
              value: "38080"
          ports:
            - name: http
              containerPort: 42069
              protocol: TCP
            - name: firmware
              containerPort: 38080
              hostPort: 38080
              protocol: TCP
          resources: {}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 42069
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 42069
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/health
              port: 42069
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
      restartPolicy: Always
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
