apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spoolman
commonLabels:
  app: spoolman

resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - catalog.yaml
  - ingress.yaml
  - config.yaml
  - secrets.yaml
  - oidc-client.yaml
  - ../../../services/forward-auth

configMapGenerator:
  - name: filament-catalog-nginx
    files:
      - nginx.conf=catalog-nginx.conf
patches:
  - patch: |
      - op: replace
        path: /spec/forwardAuth/address
        value: http://forward-auth.spoolman.svc.cluster.local:4181
    target:
      kind: Middleware
      name: forward-auth
