apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: airprint-tls
spec:
  secretName: airprint-tls
  issuerRef:
    name: private-ca
    kind: ClusterIssuer
  dnsNames:
    - capitol-reef.local
  usages:
    - digital signature
    - key encipherment
    - server auth
  privateKey:
    rotationPolicy: Always
