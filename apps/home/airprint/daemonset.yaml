apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: airprint
spec:
  selector:
    matchLabels:
      component: airprint
  template:
    metadata:
      labels:
        component: airprint
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        feature.node.kubernetes.io/usb-ff_04e8_3434.present: 'true'
      initContainers:
        - name: seed-cups-state
          image: ghcr.io/dudeofawesome/cups:20260825@sha256:c57c7ac4288f9943c68db947852514d1dad2a821ab18b39c43429e2697fcf28f
          command:
            - /bin/sh
            - -ec
            - |
              until test -S /run/dbus/system_bus_socket; do sleep 1; done
              cp -a /etc/cups/. /cups-config/
              sed "s/__NODE_NAME__/${NODE_NAME}/g" /config/cupsd.conf > /cups-config/cupsd.conf
              # CUPS reverse-resolves the local socket address when selecting TLS credentials.
              # Put the advertised node name first, retaining Kubernetes' other hosts entries.
              printf '%s %s.local\n' "$POD_IP" "$NODE_NAME" > /cups-hosts/hosts
              cat /etc/hosts >> /cups-hosts/hosts
              # Keep Bonjour identity stable across pod replacements (ephemeral state).
              uuid="$(printf '%s' "airprint:${NODE_NAME}" | sha256sum | cut -c1-32)"
              uuid="$(printf '%s' "$uuid" | sed -E 's/^(.{8})(.{4}).(.{3}).(.{3})(.{12})$/\1-\2-8\3-8\4-\5/')"
              printf '<Printer samsung-scx-4623-%s>\nUUID urn:uuid:%s\n</Printer>\n' \
                "$NODE_NAME" "$uuid" > /cups-config/printers.conf
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: cups-config
              mountPath: /cups-config
            - name: cups-hosts
              mountPath: /cups-hosts
            - name: config
              mountPath: /config
              readOnly: true
            - name: system-bus
              mountPath: /run/dbus/system_bus_socket
              readOnly: true
      containers:
        - name: cups
          image: ghcr.io/dudeofawesome/cups:20260825@sha256:c57c7ac4288f9943c68db947852514d1dad2a821ab18b39c43429e2697fcf28f
          command:
            - /bin/sh
            - -ec
            - |
              /usr/sbin/cupsd -f &
              cupsd_pid="$!"
              /config/bootstrap-cups.sh
              wait "$cupsd_pid"
          securityContext:
            privileged: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: ipp
              containerPort: 631
              hostPort: 631
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -S /run/dbus/system_bus_socket
                  lpstat -p "samsung-scx-4623-${NODE_NAME}" >/dev/null
                  openssl s_client -brief \
                    -connect "${POD_IP}:631" \
                    -servername "${NODE_NAME}.local" \
                    </dev/null >/dev/null 2>&1
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -S /run/dbus/system_bus_socket
                  lpstat -p "samsung-scx-4623-${NODE_NAME}" >/dev/null
                  openssl s_client -brief \
                    -connect "${POD_IP}:631" \
                    -servername "${NODE_NAME}.local" \
                    </dev/null >/dev/null 2>&1
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - lpstat
                - -r
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
            - name: system-bus
              mountPath: /run/dbus/system_bus_socket
              readOnly: true
            - name: avahi
              mountPath: /run/avahi-daemon/socket
              readOnly: true
            - name: cups-config
              mountPath: /etc/cups
            - name: cups-tls
              mountPath: /etc/cups/ssl
            - name: cups-hosts
              mountPath: /etc/hosts
              subPath: hosts
              readOnly: true
            - name: cups-spool
              mountPath: /var/spool/cups
            - name: config
              mountPath: /config
              readOnly: true
        - name: airsane
          image: docker.io/aguslr/airsane:20260825@sha256:c29865c037e40b52ce9ce0b7fa9fb83693be6e4d358ba1b09cdb73d50158afd2
          securityContext:
            privileged: true
          args:
            - --access-log=-
            - --debug=true
            - --listen-port=8090
            - --hotplug=true
            - --network-hotplug=false
            - --mdns-announce=true
            - --announce-secure=false
            - --announce-base-url=http://%H:8090
            - --web-interface=false
            - --reset-option=false
            - --disclose-version=false
            - --random-paths=false
            - --compatible-path=true
            - --local-scanners-only=true
          ports:
            - name: escl
              containerPort: 8090
              hostPort: 8090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /eSCL/ScannerCapabilities
              port: escl
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /eSCL/ScannerCapabilities
              port: escl
          livenessProbe:
            httpGet:
              path: /eSCL/ScannerCapabilities
              port: escl
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
            - name: system-bus
              mountPath: /run/dbus/system_bus_socket
              readOnly: true
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: system-bus
          hostPath:
            path: /run/dbus/system_bus_socket
            type: Socket
        - name: avahi
          hostPath:
            path: /run/avahi-daemon/socket
            type: Socket
        - name: cups-config
          emptyDir: {}
        - name: cups-hosts
          emptyDir: {}
        # macOS pins the server certificate; retain it when the pod is replaced.
        - name: cups-tls
          hostPath:
            path: /var/lib/airprint/cups-ssl
            type: DirectoryOrCreate
        - name: cups-spool
          emptyDir: {}
        - name: config
          configMap:
            name: cups-config
            defaultMode: 0555
