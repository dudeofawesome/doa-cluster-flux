LogLevel warn
ServerName __NODE_NAME__.local
Listen 0.0.0.0:631
Browsing Yes
DefaultShared Yes
WebInterface Yes
DefaultEncryption IfRequested
PreserveJobFiles No
PreserveJobHistory No

<Location />
  Order allow,deny
  Allow @LOCAL
  # hostPort preserves LAN client addresses; the LAN is not local to the pod.
  Allow 10.0.0.0/20
</Location>

<Location /admin>
  Order deny,allow
  Deny from all
</Location>

<Location /admin/conf>
  Order deny,allow
  Deny from all
</Location>
