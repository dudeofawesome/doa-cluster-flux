apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: airprint
commonLabels:
  app: airprint

resources:
  - namespace.yaml
  - certificate.yaml
  - daemonset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: cups-config
    files:
      - cupsd.conf
      - bootstrap-cups.sh
