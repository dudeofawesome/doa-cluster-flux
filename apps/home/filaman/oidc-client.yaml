apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: filaman
spec:
  clientId: filaman
  name: FilaMan
  description: 3D printer filament inventory
  protocol: openid-connect
  enabled: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccess: false
  public: false
  consentRequired: false
  fullScopeAllowed: false
  bearerOnly: false
  clientAuthenticatorType: client-secret
  authorizationServicesEnabled: false
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  secret: '$oidc:client_secret'
  webUrl: https://filaman.orleans.io
  redirectUris:
    - https://filaman.orleans.io/auth/oidc/callback
  webOrigins:
    - https://filaman.orleans.io
  defaultClientScopes:
    - profile
    - email
  attributes:
    pkce.code.challenge.method: S256
