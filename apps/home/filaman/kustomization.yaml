apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filaman
commonLabels:
  app: filaman
resources:
  - namespace.yaml
  - database.yaml
  - storage.yaml
  - deployment.yaml
  - ingress.yaml
  - oidc-client.yaml
  - secrets.yaml
  - forward-auth.yaml
  - ingress-auth/secrets.yaml
  - ../../../services/forward-auth

configMapGenerator:
  - name: config
    envs:
      - config.env
  - name: startup
    files:
      - startup.py
      - uv.toml

patches:
  - path: forward-auth-patch.yaml
  - target:
      kind: Middleware
      name: forward-auth
    patch: |
      - op: replace
        path: /spec/forwardAuth/address
        value: http://forward-auth.filaman.svc.cluster.local:4181
