apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1@sha256:5591f9f65926ca4b13b34cfd9c9888cb9d9ee9f147fe0b04c8e025cbeeee0eb7
          imagePullPolicy: IfNotPresent
          args:
            - --storage-path
            - /data
            - --ble-proxy
          ports:
            - name: websocket
              containerPort: 5580
              protocol: TCP
          resources: {}
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      restartPolicy: Always
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
