apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes

configMapGenerator:
  - name: hermes-config-source
    files:
      - config.yaml

configurations:
  - kustomize-config.yaml

resources:
  - namespace.yaml
  - instance.yaml
  - inference-network-policy.yaml
  - oidc-client.yaml
  - ingress.yaml
