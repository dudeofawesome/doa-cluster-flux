apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes

configMapGenerator:
  - name: hermes-config-source
    files:
      - config.yaml

configurations:
  - kustomize-config.yaml

resources:
  - namespace.yaml
  - instance.yaml
  - inference-network-policy.yaml
  - oidc-client.yaml
  - ingress.yaml
  - forward-auth.yaml
  - ingress-auth/secrets.yaml
  - ../../../services/forward-auth

patches:
  - path: forward-auth-patch.yaml
  - target:
      kind: Middleware
      name: forward-auth
    patch: |
      - op: replace
        path: /spec/forwardAuth/address
        value: http://forward-auth.hermes.svc.cluster.local:4181
