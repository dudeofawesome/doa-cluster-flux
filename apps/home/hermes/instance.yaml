---
apiVersion: hermes.agent/v1
kind: HermesInstance
metadata:
  name: hermes
spec:
  image:
    repository: docker.io/nousresearch/hermes-agent
    tag: v2026.9.14
    digest: sha256:99641e57ec762c59e54cb44aa6746b7fc68c18b3c5ddb088af54234c613d9294
  config:
    configMapRef:
      name: hermes-config-source
  env:
    # Kustomize rewrites this to the generated name, including its content hash.
    # Changing config then changes the pod template and refreshes the subPath mount.
    - name: HERMES_CONFIG_SOURCE
      value: hermes-config-source
    - name: TZ
      value: America/Los_Angeles
    - name: HERMES_DASHBOARD
      value: 'true'
    - name: HERMES_DASHBOARD_HOST
      value: 0.0.0.0
    - name: HERMES_DASHBOARD_PORT
      value: '9119'
  storage:
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 4Gi
  networking:
    service:
      type: ClusterIP
      ports:
        - name: gateway
          port: 8443
        - name: dashboard
          port: 9119
  security:
    networkPolicy:
      enabled: true
      allowDNS: true
      allowedIngressNamespaces:
        - kube-system
  selfConfigure:
    enabled: false
  autoUpdate:
    enabled: false
