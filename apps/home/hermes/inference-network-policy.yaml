apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: hermes
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeai-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kubeai
              app.kubernetes.io/instance: kubeai
      ports:
        - port: 8000
          protocol: TCP
