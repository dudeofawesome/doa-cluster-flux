apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: christmas-lights
labels:
  - pairs:
      app: christmas-lights
    includeSelectors: true
    includeTemplates: true
resources:
  - namespace.yaml
  - deployment.yaml
configMapGenerator:
  - name: configuration
    envs:
      - config.env
