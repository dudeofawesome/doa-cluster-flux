apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome:2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6052
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: config
              mountPath: /config
        - name: config-git-sync
          image: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /usr/local/bin/git-sync.sh
          env:
            - name: GIT_REPO_DIR
              value: /config
            - name: GIT_REMOTE
              value: ssh://git@github.com/dudeofawesome/esphome-devices
            - name: GIT_BRANCH
              value: main
            - name: GIT_SYNC_INTERVAL
              value: '300'
          resources: {}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-git-sync
              mountPath: /usr/local/bin/git-sync.sh
              subPath: git-sync.sh
              readOnly: true
            - name: config-git-ssh
              mountPath: /etc/git-secret
              readOnly: true
      restartPolicy: Always
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: config-git-sync
          configMap:
            name: config-git-sync
            defaultMode: 0555
        - name: config-git-ssh
          secret:
            secretName: esphome-config-git
            defaultMode: 0400
