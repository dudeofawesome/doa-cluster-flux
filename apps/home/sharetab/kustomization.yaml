apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sharetab
commonLabels:
  app: sharetab
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - storage.yaml
  - ingress.yaml
  - secrets.yaml
  - oidc-client.yaml

configMapGenerator:
  - name: config
    envs:
      - config.env
