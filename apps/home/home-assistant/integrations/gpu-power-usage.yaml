rest:
  - resource: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
    params:
      # Deduplicate workload series for each GPU before summing cluster power.
      query: sum(max by (UUID) (DCGM_FI_DEV_POWER_USAGE))
    scan_interval: 30
    sensor:
      - name: Sequoia cluster GPU power
        unique_id: sequoia_cluster_gpu_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: >-
          {{ value_json is defined
             and value_json.status == 'success'
             and value_json.data.result | length > 0
             and is_number(value_json.data.result[0].value[1]) }}
        value_template: >-
          {{ value_json.data.result[0].value[1] | float(none)
             if value_json is defined
                and value_json.status == 'success'
                and value_json.data.result | length > 0
             else none }}

sensor:
  # Integrate watts over hours to accumulate energy in kWh.
  - platform: integration
    source: sensor.sequoia_cluster_gpu_power
    name: Sequoia cluster GPU energy
    unique_id: sequoia_cluster_gpu_energy
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 6
    # Keep accumulating while power remains unchanged.
    max_sub_interval:
      minutes: 1
