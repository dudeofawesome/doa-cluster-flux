apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      initContainers:
        - name: initialize-config
          image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - cd /config && mkdir -p themes blueprints/automation/dudeofawesome && touch automations.yaml scripts.yaml scenes.yaml
          volumeMounts:
            - name: ha-config-root
              mountPath: /config
        # DNS and PostgreSQL can recover after this pod during cluster startup.
        # Wait for an authenticated query, rather than just an open TCP port.
        - name: wait-for-database
          image: 'ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133'
          command:
            - python3
            - -u
            - -c
            - |
              import os
              import time

              import psycopg2

              while True:
                  try:
                      connection = psycopg2.connect(
                          os.environ['DB_URI'],
                          connect_timeout=5,
                          options='-c statement_timeout=5000',
                          target_session_attrs='read-write',
                      )
                      try:
                          connection.set_session(readonly=True, autocommit=True)
                          with connection.cursor() as cursor:
                              cursor.execute('SELECT 1')
                      finally:
                          connection.close()
                  except psycopg2.Error:
                      # Connection errors can contain credentials; do not log them.
                      print('Waiting for PostgreSQL DNS, authentication, and readiness...')
                      time.sleep(5)
                  else:
                      print('PostgreSQL is ready; starting Home Assistant.')
                      break
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
      # securityContext:
      #   fsGroup: 33
      #   fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: home-assistant-app
          image: 'ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133'
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: environment
            - secretRef:
                name: pdu-snmp
          env:
            - name: SETUP_PORT
              value: '8123'

            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri

            - name: oidc_issuer_url
              valueFrom:
                configMapKeyRef:
                  name: oidc
                  key: issuer_url
            - name: oidc_client_id
              valueFrom:
                configMapKeyRef:
                  name: oidc
                  key: client_id
            - name: oidc_client_secret
              valueFrom:
                secretKeyRef:
                  name: oidc
                  key: client_secret
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          resources: {}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: ha-config-root
              mountPath: /config
            - name: ha-configuration-base
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: authentication-scripts
              mountPath: /usr/bin/auth-oidc.py
              subPath: auth-oidc.py
              readOnly: true
            - name: ha-configuration-base
              mountPath: /config/integrations/pdu-sensors.yaml
              subPath: pdu-sensors.yaml
              readOnly: true
            - name: ha-configuration-base
              mountPath: /config/integrations/gpu-power-usage.yaml
              subPath: gpu-power-usage.yaml
              readOnly: true
      restartPolicy: Always
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: ha-config-root
          persistentVolumeClaim:
            claimName: config-root
        - name: ha-configuration-base
          configMap:
            name: configuration
            items:
              - key: configuration.yaml
                path: configuration.yaml
              - key: pdu-sensors.yaml
                path: pdu-sensors.yaml
              - key: gpu-power-usage.yaml
                path: gpu-power-usage.yaml
        - name: authentication-scripts
          configMap:
            name: authentication-scripts
            items:
              - key: auth-oidc.py
                path: auth-oidc.py
                mode: 0555
