# Loads default set of integrations. Do not remove.
default_config:
  exclude:
    - usb

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

sensor: !include pdu-sensors.yaml

template:
  - sensor:
      - name: Sequoia PDU apparent power
        unique_id: sequoia_pdu_apparent_power
        device_class: apparent_power
        state_class: measurement
        unit_of_measurement: VA
        availability: >-
          {{ is_number(states('sensor.sequoia_pdu_current'))
             and is_number(states('sensor.sequoia_pdu_voltage')) }}
        state: >-
          {{ ((states('sensor.sequoia_pdu_current') | float(0))
              * (states('sensor.sequoia_pdu_voltage') | float(0))) | round(1) }}

homeassistant:
  auth_providers:
    - name: Sequoia
      type: command_line
      meta: true
      command: /usr/bin/auth-oidc.py
      args:
        - !env_var oidc_issuer_url
        - 'false' # oidc_issuer_validate_cert
        - !env_var oidc_client_id
        - !env_var oidc_client_secret
    - type: homeassistant
  allowlist_external_urls:
    - 'http://localhost:8123'
    - 'http://home-assistant.home-assistant.svc.cluster.local:8123'

recorder:
  db_url: !env_var DB_URI
  purge_keep_days: 30

# minimal required config
# https://adaptive-lighting.nijho.lt/getting-started/#step-1-add-to-configurationyaml
adaptive_lighting:
