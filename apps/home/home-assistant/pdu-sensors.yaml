# Verified on PDUMV30NET / PowerAlert 12.06.0069.
# SNMPv3 authPriv: the same credential is used for authentication and privacy.
- <<: &sequoia_pdu_snmp
    platform: snmp
    host: 10.0.1.41 # sequoia-pdu
    version: '3'
    username: !env_var PDU_SNMP_USERNAME
    auth_protocol: hmac-md5
    auth_key: !env_var PDU_SNMP_PASSWORD
    priv_protocol: des
    priv_key: !env_var PDU_SNMP_PASSWORD
    accept_errors: true
    scan_interval: 60
  name: Sequoia PDU current
  unique_id: sequoia_pdu_current
  baseoid: '1.3.6.1.2.1.33.1.4.4.1.3.1'
  device_class: current
  state_class: measurement
  unit_of_measurement: A
  value_template: '{{ (value | float) / 10 }}'

- <<: *sequoia_pdu_snmp
  name: Sequoia PDU voltage
  unique_id: sequoia_pdu_voltage
  baseoid: '1.3.6.1.2.1.33.1.3.3.1.3.1'
  device_class: voltage
  state_class: measurement
  unit_of_measurement: V
  value_template: '{{ value | float }}'

- <<: *sequoia_pdu_snmp
  name: Sequoia PDU frequency
  unique_id: sequoia_pdu_frequency
  baseoid: '1.3.6.1.2.1.33.1.3.3.1.2.1'
  device_class: frequency
  state_class: measurement
  unit_of_measurement: Hz
  value_template: '{{ (value | float) / 10 }}'

- <<: *sequoia_pdu_snmp
  name: Sequoia PDU bank 1 breaker
  unique_id: sequoia_pdu_bank_1_breaker
  baseoid: '1.3.6.1.4.1.850.100.1.4.7.1.2.1'
  icon: mdi:electric-switch
  value_template: "{{ {0: 'open', 1: 'closed'}.get(value | int(-1), 'unknown') }}"

