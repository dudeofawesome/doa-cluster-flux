apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: trek
spec:
  clientId: trek
  name: TREK
  description: Travel planner at trek.orleans.io
  protocol: openid-connect
  enabled: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccess: false
  public: false
  consentRequired: false
  fullScopeAllowed: false
  bearerOnly: false
  clientAuthenticatorType: client-secret
  authorizationServicesEnabled: false
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  secret: '$trek:client_secret'
  webUrl: https://trek.orleans.io
  redirectUris:
    - https://trek.orleans.io/api/auth/oidc/callback
  webOrigins:
    - https://trek.orleans.io
  defaultClientScopes:
    - profile
    - email
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        access.token.claim: 'true'
        claim.name: groups
        full.path: 'true'
        id.token.claim: 'true'
        userinfo.token.claim: 'true'
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: https://trek.orleans.io
