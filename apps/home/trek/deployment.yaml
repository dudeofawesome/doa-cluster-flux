apiVersion: apps/v1
kind: Deployment
metadata:
  name: trek
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # SQLite must have only one writer, including during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trek
          image: mauriceboe/trek:4.3.4@sha256:6b7c8f275cc0ff3ca44979084bf078f553c96a0564493a132c1631ffaf6c3e77
          imagePullPolicy: IfNotPresent
          # Keep the image's dumb-init entrypoint; bypass its root-only chown/gosu wrapper.
          workingDir: /app/server
          args: [node, --require, tsconfig-paths/register, dist/index.js]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: config
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: trek
                  key: encryption_key
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trek
                  key: client_secret
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
