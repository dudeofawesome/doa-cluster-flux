apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: docker.io/louislam/uptime-kuma:2.5.3-rootless@sha256:79c639df9a2f26472bfcf48bb95a4e38533ce049158b79d4871a8bac787b6e71
          command:
            - chown
            - 1000:1000
            - /app/data
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma:2.5.3-rootless@sha256:79c639df9a2f26472bfcf48bb95a4e38533ce049158b79d4871a8bac787b6e71
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: UPTIME_KUMA_DB_TYPE
              value: mariadb
          envFrom:
            - secretRef:
                name: database-connection
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 5
            periodSeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  labels:
    monitor: uptime-kuma
spec:
  selector:
    component: app
  ports:
    - name: http
      port: 80
      targetPort: http
