# Explicit opt-in monitors for Traefik IngressRoutes; Grafana uses Ingress annotations.
apiVersion: uptime-kuma.io/v1alpha1
kind: Monitor
metadata:
  name: atuin
spec:
  name: atuin
  type: HTTP
  interval: 60
  retryInterval: 60
  retries: 2
  resendInterval: 0
  notifications: []
  http:
    url: https://atuin.orleans.io/
    method: GET
    timeout: 10
    # Check the ingress response without following SSO to Keycloak.
    maxRedirects: 0
    acceptedStatusCodes: ['200-399']
    ignoreTLS: false
---
