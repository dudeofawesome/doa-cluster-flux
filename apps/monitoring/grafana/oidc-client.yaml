apiVersion: v1.edp.epam.com/v1
kind: KeycloakClient
metadata:
  name: grafana
spec:
  clientId: grafana
  name: Grafana
  description: Cluster metrics and dashboards at grafana.orleans.io
  protocol: openid-connect
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccess: false
  public: false
  enabled: true
  consentRequired: false
  fullScopeAllowed: true
  bearerOnly: false
  clientAuthenticatorType: client-secret
  authorizationServicesEnabled: false
  realmRef:
    kind: ClusterKeycloakRealm
    name: sequoia
  secret: '$oidc:client_secret'
  webUrl: https://grafana.orleans.io
  redirectUris:
    - https://grafana.orleans.io/login/generic_oauth
  webOrigins:
    - https://grafana.orleans.io
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        access.token.claim: 'true'
        claim.name: groups
        full.path: 'true'
        id.token.claim: 'true'
        userinfo.token.claim: 'true'
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: https://grafana.orleans.io/login
