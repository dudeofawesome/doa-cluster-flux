apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.2.1-distroless
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: https://grafana.orleans.io
    users:
      allow_sign_up: 'false'
    auth.anonymous:
      enabled: 'false'
    auth.generic_oauth:
      enabled: 'true'
      name: Keycloak
      auto_login: 'false'
      allow_sign_up: 'true'
      client_id: grafana
      scopes: openid email profile
      auth_url: https://auth.orleans.io/realms/sequoia/protocol/openid-connect/auth
      token_url: https://auth.orleans.io/realms/sequoia/protocol/openid-connect/token
      api_url: https://auth.orleans.io/realms/sequoia/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      allowed_groups: /Admins
      role_attribute_path: contains(groups[*], '/Admins') && 'Admin'
      role_attribute_strict: 'true'
      allow_assign_grafana_admin: 'false'
      skip_org_role_sync: 'false'
      use_pkce: 'true'
      use_refresh_token: 'true'
      validate_id_token: 'true'
      jwk_set_url: https://auth.orleans.io/realms/sequoia/protocol/openid-connect/certs
      signout_redirect_url: https://auth.orleans.io/realms/sequoia/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.orleans.io%2Flogin
    analytics:
      reporting_enabled: 'false'
    log:
      mode: console
  deployment:
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: grafana
        spec:
          nodeSelector:
            kubernetes.io/hostname: kings-canyon
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: oidc
                      key: client_secret
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-user
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-password
              ports:
                - name: grafana-http
                  containerPort: 3000
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              startupProbe:
                httpGet:
                  path: /api/health
                  port: grafana-http
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: grafana-http
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: grafana-http
                periodSeconds: 30
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-data
