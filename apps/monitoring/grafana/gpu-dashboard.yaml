apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-overview
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: Hardware
  resyncPeriod: 10m
  json: |
    {
      "id": null,
      "uid": "cluster-gpus",
      "title": "GPU Overview",
      "description": "NVIDIA GeForce GPU monitoring through DCGM. Device-wide readings are deduplicated across workload assignments. Unsupported fields show no data.",
      "tags": [
        "gpu",
        "nvidia",
        "dcgm"
      ],
      "timezone": "browser",
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(DCGM_FI_DEV_GPU_UTIL, node)",
            "query": {
              "query": "label_values(DCGM_FI_DEV_GPU_UTIL, node)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "gpu",
            "label": "GPU UUID",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(DCGM_FI_DEV_GPU_UTIL{node=~\"${node:regex}\"}, UUID)",
            "query": {
              "query": "label_values(DCGM_FI_DEV_GPU_UTIL{node=~\"${node:regex}\"}, UUID)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "GPU utilization",
          "type": "timeseries",
          "description": "Device-wide utilization; pod labels identify GPU assignments, not per-pod usage.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_GPU_UTIL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 2,
          "title": "VRAM used",
          "type": "timeseries",
          "description": "Used memory as a percentage of total device VRAM.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * max by (node, UUID, modelName) (DCGM_FI_DEV_FB_USED{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"}) / max by (node, UUID, modelName) (DCGM_FI_DEV_FB_TOTAL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 3,
          "title": "VRAM capacity",
          "type": "timeseries",
          "description": "Exporter values are MiB; converted to bytes for Grafana formatting.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_FB_USED{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"}) * 1048576",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · used",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_FB_FREE{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"}) * 1048576",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · free",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_FB_TOTAL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"}) * 1048576",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · total",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 4,
          "title": "GPU and memory temperature",
          "type": "timeseries",
          "description": "Memory temperature may be absent when the card or driver does not expose it.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_GPU_TEMP{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · GPU",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_MEMORY_TEMP{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · memory",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 5,
          "title": "Fan speed",
          "type": "timeseries",
          "description": "Percentage of maximum fan speed; unavailable readings remain empty.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_FAN_SPEED{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 6,
          "title": "Power draw and limits",
          "type": "timeseries",
          "description": "Compare draw with configured and effective power limits.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_POWER_USAGE{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · draw",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_POWER_MGMT_LIMIT{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · configured limit",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_ENFORCED_POWER_LIMIT{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · enforced limit",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 7,
          "title": "GPU and memory clocks",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: MHz",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_SM_CLOCK{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · SM",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_MEM_CLOCK{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · memory",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 8,
          "title": "Performance state",
          "type": "timeseries",
          "description": "P0 is highest performance; P15 is lowest. This is a state, not a utilization percentage.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "max": 15,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_PSTATE{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 9,
          "title": "Clock limit activations",
          "type": "timeseries",
          "description": "Counts transitions into power, thermal, or hardware clock limits; not time spent throttled. Idle and user clock-setting events are excluded. A reason appears after its first observed activation.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: events/min",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName, clock_event) (rate(DCGM_EXP_CLOCK_EVENTS_TOTAL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\",clock_event=~\"power_cap|hw_slowdown|sync_boost|sw_thermal|hw_thermal|hw_power_brake\"}[$__rate_interval])) * 60",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · {{clock_event}}",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 10,
          "title": "Energy consumed in selected range",
          "type": "stat",
          "description": "Energy counter in millijoules converted to kWh. The counter resets on driver reload; increase handles resets. Requires hardware support and at least two samples.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (increase(DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"}[$__range])) / 3600000000",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}}",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 11,
          "title": "Memory and video engine utilization",
          "type": "timeseries",
          "description": "Memory activity measures utilization, not occupied VRAM.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_MEM_COPY_UTIL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · memory activity",
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_ENC_UTIL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · encoder",
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, UUID, modelName) (DCGM_FI_DEV_DEC_UTIL{node=~\"${node:regex}\",UUID=~\"${gpu:regex}\"})",
              "legendFormat": "{{node}} · {{modelName}} · {{UUID}} · decoder",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "id": 12,
          "title": "Last XID error code",
          "type": "stat",
          "description": "Last driver-reported XID code, not an error count. A nonzero code can refer to an earlier fault.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "refId": "A",
