apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  annotations:
    uptime-kuma.io/enabled: 'true'
    uptime-kuma.io/name: grafana
    uptime-kuma.io/interval: '60'
    uptime-kuma.io/max-retries: '2'
    http.uptime-kuma.io/timeout: '10'
    http.uptime-kuma.io/max-redirects: '0'
    http.uptime-kuma.io/accepted-statuscodes: '200-399'
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.orleans.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
  tls:
    - secretName: wildcard-orleans-io
      hosts:
        - grafana.orleans.io
