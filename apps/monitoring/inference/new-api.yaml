apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: new-api-config
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [new-api]
  selector:
    matchLabels:
      app: new-api
  podMetricsEndpoints:
    - port: config-metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: new-api-config
  labels:
    release: monitoring
spec:
  groups:
    - name: new-api-config
      rules:
        - alert: NewAPIConfigurationStale
          expr: new_api_config_success_age_seconds{namespace="new-api"} > 900
          labels:
            severity: warning
          annotations:
            summary: New API configuration reconciliation is stale
            description: 'No complete reconciliation has succeeded for over 15 minutes in {{ $labels.namespace }}/{{ $labels.pod }}. The API continues serving its applied configuration. Check the config container logs for discovery or configuration errors.'
