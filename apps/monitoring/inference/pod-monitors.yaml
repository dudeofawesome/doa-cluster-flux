# question: what is the point of these PodMonitors?

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kubeai
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [kubeai-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeai
      app.kubernetes.io/instance: kubeai
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: inference-llamacpp
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [inference]
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
      app.kubernetes.io/managed-by: kubeai
  podMetricsEndpoints:
    - port: http
      interval: 30s
