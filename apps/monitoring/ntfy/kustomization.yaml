apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy
labels:
  - pairs:
      app: ntfy
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - database.yaml
  - secrets.yaml
  - deployment.yaml
  - ingress.yaml
  - network-policy.yaml

configMapGenerator:
  - name: config
    files:
      - config/server.yml
      - config/flux.yml
