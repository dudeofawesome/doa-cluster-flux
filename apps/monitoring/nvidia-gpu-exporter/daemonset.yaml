apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-gpu-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-gpu-exporter
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        # The upstream NVML image is Linux amd64 only.
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        feature.node.kubernetes.io/nvidia-runtime.configured: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/utkuozdemir/nvidia_gpu_exporter:1.15.1-nvml
          args:
            - --collect.backend=nvml
            - --collect.pcie-throughput
            - --collect.interval=1s
            - --collect.timeout=5s
            # DCGM remains responsible for general GPU telemetry. Required
            # identity fields are automatically included by the exporter.
            - --query-field-names=uuid,name
          env:
            # Observe GPUs without reserving resources needed by inference pods.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 9835
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            periodSeconds: 30
