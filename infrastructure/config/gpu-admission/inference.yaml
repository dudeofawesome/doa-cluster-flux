# KubeAI's rtx3060 models get their GPUs from the device plugin's
#   NVIDIA_VISIBLE_DEVICES, which kubelet adds after admission. A value in the
#   pod spec would replace that allocation (and could name a card another model
#   holds), and a pod without a GPU request would see the image's `all`.
#   rtx3090 models are covered by rtx3090-pinned instead.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: inference-device-plugin-gpus
spec:
  # Fail open on evaluation errors rather than blocking model pods.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    - name: nvidia-runtime-without-rtx3090
      expression: |-
        has(object.spec.runtimeClassName) &&
        object.spec.runtimeClassName == 'nvidia' &&
        !(object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .exists(c,
          has(c.resources.limits) && 'devic.es/rtx3090' in c.resources.limits)
  variables:
    - name: containers
      expression: |-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: envs
      expression: |-
        variables.containers.map(c, has(c.env) ? c.env : []) +
        (has(object.spec.ephemeralContainers)
          ? object.spec.ephemeralContainers.map(c, has(c.env) ? c.env : [])
          : [])
  validations:
    - expression: |-
        variables.containers.exists(c,
          has(c.resources.limits) && 'nvidia.com/gpu' in c.resources.limits)
      message: >-
        Pods using the nvidia RuntimeClass must request nvidia.com/gpu or
        devic.es/rtx3090.
    - expression: |-
        variables.envs.all(env,
          !env.exists(e, e.name == 'NVIDIA_VISIBLE_DEVICES'))
      message: >-
        NVIDIA_VISIBLE_DEVICES comes from the device plugin; setting it would
        override the allocated GPUs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: inference-device-plugin-gpus
spec:
  policyName: inference-device-plugin-gpus
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: inference
