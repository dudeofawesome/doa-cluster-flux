apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: rtx3090
spec:
  rules:
    # Schedules generic-device-plugin, which advertises devic.es/rtx3090.
    - name: NVIDIA GeForce RTX 3090
      labels:
        feature.node.kubernetes.io/rtx3090.present: 'true'
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            class: { op: In, value: ['0300'] }
            vendor: { op: In, value: ['10de'] }
            device: { op: In, value: ['2204'] }
