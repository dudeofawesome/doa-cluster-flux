apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: christmas-lights-relay
spec:
  rules:
    - name: Christmas Lights Relay christmas-lights-001
      labels:
        feature.node.kubernetes.io/christmas-lights-relay.present: 'true'
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            vendor: { op: In, value: ['1b4f'] }
            device: { op: In, value: ['9206'] }
            serial: { op: In, value: ['christmas-lights-001'] }
