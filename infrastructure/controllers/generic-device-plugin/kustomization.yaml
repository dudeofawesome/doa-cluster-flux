apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: generic-device-plugin
labels:
  - pairs:
      app: generic-device-plugin
    includeSelectors: true
    includeTemplates: true
resources:
  - namespace.yaml
  - daemonset.yaml
configMapGenerator:
  - name: configuration
    files:
      - config.yaml
