apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra
  namespace: nvidia-dra
spec:
  interval: 30m
  timeout: 5m
  dependsOn:
    - name: nfd
      namespace: node-feature-discovery
    - name: nvidia-device-plugin
      namespace: kube-system
  chart:
    spec:
      chart: dra-driver-nvidia-gpu
      version: '0.5.1'
      sourceRef:
        kind: HelmRepository
        name: nvidia-dra
        namespace: flux-system
      interval: 12h
  values:
    # The companion NixOS configuration exposes an unpatched driver tree here.
    nvidiaDriverRoot: /run/nvidia/dra-driver
    # CDI hooks run on the host; the image's generic Linux binary cannot run on NixOS.
    nvidiaCDIHookPath: /etc/nvidia-dra/nvidia-cdi-hook
    resourceApiVersion: resource.k8s.io/v1
    gpuResourcesEnabledOverride: true
    resources:
      gpus:
        enabled: true
      computeDomains:
        enabled: false
    logVerbosity: '2'
    kubeletPlugin:
      # K3s uses its default /var/lib/kubelet with external containerd.
      kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
      kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
      nodeSelector:
        feature.node.kubernetes.io/nvidia-dra.configured: 'true'
      affinity: null
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        gpus:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
