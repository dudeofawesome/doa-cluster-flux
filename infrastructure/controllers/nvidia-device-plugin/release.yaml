apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  releaseName: nvidia-device-plugin
  interval: 30m
  dependsOn:
    - name: nfd
      namespace: node-feature-discovery
  chart:
    spec:
      chart: nvidia-device-plugin
      version: '0.20.1'
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
      interval: 12h
  values:
    runtimeClassName: nvidia
    # Restrict DaemonSet targets as well as RuntimeClass pod scheduling.
    nodeSelector:
      feature.node.kubernetes.io/nvidia-runtime.configured: 'true'
    affinity: null
    deviceListStrategy: envvar
    # The plugin only sees the GPUs listed in the patch below, and NVML numbers
    #   them from 0 inside its container, so indexes would name the wrong host
    #   GPUs. UUIDs need kings-canyon's CDI spec to include UUID device names;
    #   see docs/gpus.md.
    deviceIDStrategy: uuid
    migStrategy: none
    failOnInitError: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: nvidia-device-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: nvidia-device-plugin
              spec:
                template:
                  spec:
                    containers:
                      - name: nvidia-device-plugin-ctr
                        env:
                          # The chart hardcodes `all`. Advertise only the
                          #   kings-canyon RTX 3060s as nvidia.com/gpu; the RTX
                          #   3090 is devic.es/rtx3090 (generic-device-plugin).
                          - name: NVIDIA_VISIBLE_DEVICES
                            value: GPU-0e5f94ee-b735-84ad-6e2f-61ab731b442f,GPU-8b0b486f-fe4e-78fc-597f-2eaa9ec0b7a3
