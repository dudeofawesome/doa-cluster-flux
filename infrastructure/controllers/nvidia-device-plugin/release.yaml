apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  releaseName: nvidia-device-plugin
  interval: 30m
  dependsOn:
    - name: nfd
      namespace: node-feature-discovery
  chart:
    spec:
      chart: nvidia-device-plugin
      version: '0.20.1'
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
      interval: 12h
  values:
    runtimeClassName: nvidia
    # Restrict DaemonSet targets as well as RuntimeClass pod scheduling.
    nodeSelector:
      feature.node.kubernetes.io/nvidia-runtime.configured: 'true'
    affinity: null
    deviceListStrategy: envvar
    deviceIDStrategy: index
    migStrategy: none
    failOnInitError: true
