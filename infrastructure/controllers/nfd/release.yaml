apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfd
  namespace: node-feature-discovery
spec:
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  chart:
    spec:
      chart: node-feature-discovery
      version: '0.19.0'
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: flux-system
      interval: 12h
  values:
    image:
      # renovate: datasource=docker depName=registry.k8s.io/nfd/node-feature-discovery
      tag: v0.20.1@sha256:6fc5c9af9176e1acb5ce57a4a1d0c0d3eb25cd34f5bdd0efefebf0efe45a8379
    worker:
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          # Allow a worker update alongside one terminating pod on an offline node.
          maxUnavailable: 2
      # Set orleans.io/maintenance=true on nodes excluded during maintenance.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: orleans.io/maintenance
                    operator: NotIn
                    values: ['true']
      tolerations:
        - effect: NoSchedule
          operator: Exists
