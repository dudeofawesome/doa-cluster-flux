apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 30m
  timeout: 5m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  chart:
    spec:
      chart: llmkube
      version: '0.10.2'
      sourceRef:
        kind: HelmRepository
        name: llmkube
        namespace: flux-system
      interval: 12h
  values:
    namespace: llmkube-system
    # Create cache PVCs only when inference services are added.
    modelCache:
      enabled: true
      mode: perService
    webhook:
      certManager:
        enabled: true
