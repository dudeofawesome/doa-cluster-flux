apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeai
  namespace: kubeai-system
spec:
  interval: 30m
  dependsOn:
    - name: nvidia-dra
      namespace: nvidia-dra
  timeout: 5m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  chart:
    spec:
      chart: kubeai
      version: '0.24.0'
      sourceRef:
        kind: HelmRepository
        name: kubeai
        namespace: flux-system
      interval: 12h
  values:
    fullnameOverride: kubeai
    replicaCount: 1
    watchNamespaces: [inference]
    open-webui:
      enabled: false
    k8s-aibom:
      enabled: false
    # Keep the API internal; enabling ingress would create an external HTTP route.
    ingress:
      enabled: false
    service:
      type: ClusterIP
      port: 80
    modelServiceAccount:
      create: false
      name: kubeai-models
      automount: false
    modelServerPods:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    modelServers:
      LlamaCpp:
        images:
          # Shared image pin for all llama.cpp models using the GPU profile.
          # renovate: datasource=docker depName=ghcr.io/ggml-org/llama.cpp versioning=regex:^server-cuda13-b(?<patch>[0-9]+)$
          nvidia-gpu: ghcr.io/ggml-org/llama.cpp:server-cuda13-b11552@sha256:48f87d72fb1d226ac6064e7c7ef9068ac305dc5014b7dc9251fa62e7f9f6ddc4
    resourceProfiles:
      whisper-cpu:
        imageName: cpu
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
      # One full matching GPU per unit; models select rtx3060:1 or rtx3060:2.
      # DRAExtendedResource must be enabled on the K3s host (Kubernetes 1.35).
      rtx3060:
        imageName: nvidia-gpu
        nodeSelector:
          kubernetes.io/hostname: kings-canyon
          feature.node.kubernetes.io/nvidia-dra.configured: 'true'
        requests:
          deviceclass.resource.kubernetes.io/rtx3060.gpu.nvidia.com: '1'
          cpu: '2'
          memory: 4Gi
        limits:
          deviceclass.resource.kubernetes.io/rtx3060.gpu.nvidia.com: '1'
          memory: 16Gi
      rtx3090:
        imageName: nvidia-gpu
        nodeSelector:
          kubernetes.io/hostname: kings-canyon
          feature.node.kubernetes.io/nvidia-dra.configured: 'true'
        requests:
          deviceclass.resource.kubernetes.io/rtx3090.gpu.nvidia.com: '1'
          cpu: '2'
          memory: 4Gi
        limits:
          deviceclass.resource.kubernetes.io/rtx3090.gpu.nvidia.com: '1'
          memory: 16Gi
    modelAutoscaling:
      interval: 10s
      timeWindow: 30s
    modelRollouts:
      surge: 0
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kubeai
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kubeai
              spec:
                template:
                  spec:
                    containers:
                      - name: kubeai
                        ports:
                          - name: metrics
                            containerPort: 8080
                            protocol: TCP
