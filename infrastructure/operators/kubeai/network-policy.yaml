apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeai-api
  namespace: kubeai-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeai
      app.kubernetes.io/instance: kubeai
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hermes, mealie, home-assistant]
      ports:
        - port: 8000
          protocol: TCP
    - from:
        # The autoscaler scrapes its own proxy metrics.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubeai
              app.kubernetes.io/instance: kubeai
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
