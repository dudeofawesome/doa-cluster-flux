# Temporary migration helper: remove after the operator is ready in grafana-operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-migration
  namespace: grafana-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-migration
  namespace: grafana
rules:
  - apiGroups: [grafana.integreatly.org]
    resources: [grafanadashboards, grafanadatasources]
    verbs: [list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-migration
  namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-migration
subjects:
  - kind: ServiceAccount
    name: grafana-migration
    namespace: grafana-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-migration
  namespace: grafana-operator
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: grafana-migration
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finalize
          image: docker.io/library/python:3.13-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          command: [python, -u, -c]
          args:
            - |
              import json
              import ssl
              import time
              import urllib.error
              import urllib.request
              from pathlib import Path

              credentials = Path('/var/run/secrets/kubernetes.io/serviceaccount')
              context = ssl.create_default_context(cafile=str(credentials / 'ca.crt'))
              base = 'https://kubernetes.default.svc/apis/grafana.integreatly.org/v1beta1/namespaces/grafana/'

              def request(path, patch=None):
                  headers = {'Authorization': 'Bearer ' + (credentials / 'token').read_text().strip()}
                  data = None
                  if patch is not None:
                      headers['Content-Type'] = 'application/merge-patch+json'
                      data = json.dumps(patch).encode()
                  req = urllib.request.Request(base + path, data=data, headers=headers,
                                               method='PATCH' if patch is not None else 'GET')
                  try:
                      with urllib.request.urlopen(req, context=context, timeout=20) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return {'items': []}
                      raise

              for attempt in range(270):
                  remaining = 0
                  for resource in ('grafanadashboards', 'grafanadatasources'):
                      for item in request(resource)['items']:
                          meta = item['metadata']
                          remaining += 1
                          finalizers = meta.get('finalizers', [])
                          if meta.get('deletionTimestamp') and 'operator.grafana.com/finalizer' in finalizers:
                              request(resource + '/' + meta['name'], {'metadata': {
                                  'resourceVersion': meta['resourceVersion'],
                                  'finalizers': [f for f in finalizers if f != 'operator.grafana.com/finalizer']
                              }})
                              print('Finalized', resource, meta['name'])
                  if remaining == 0:
                      print('Old Grafana custom resources removed; ready for GitOps restoration')
                      break
                  time.sleep(2)
              else:
                  raise RuntimeError('Timed out waiting for the Grafana namespace migration')
