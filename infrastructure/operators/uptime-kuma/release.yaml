apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma-operator
spec:
  interval: 30m
  timeout: 5m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  chart:
    spec:
      chart: uptime-kuma-operator
      version: '0.5.0'
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma-operator
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/roxxas96/uptime-kuma-operator
      tag: '0.5.0@sha256:bbc2ecbe1e35a990c3d8c26652333d69ab83d1cf50441f1663a27686154dc26b'
      pullPolicy: IfNotPresent
    # The published release contains a linux/amd64 image.
    nodeSelector:
      kubernetes.io/arch: amd64
    kuma:
      url: http://uptime-kuma.uptime-kuma.svc.cluster.local
      existingSecret: kuma-credentials
    # Namespace scope and opt-in are independent. Do not import unannotated routes.
    watchAll: false
    watchNamespaces:
      - uptime-kuma
      - grafana
    optInByDefault: false
    driftCheckInterval: 30s
    logLevel: info
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
    networkPolicy:
      enabled: true
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: uptime-kuma
              podSelector:
                matchLabels:
                  app: uptime-kuma
                  component: app
          ports:
            - protocol: TCP
              port: 3001
      extraIngress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - protocol: TCP
              port: 8080
