apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: renovate-operator
spec:
  entryPoints:
    - websecure
  routes:
    # GitHub authenticates with a webhook signature, independently of UI OIDC.
    - match: Host(`renovate.orleans.io`) && Path(`/webhook/v1/github`)
      kind: Rule
      priority: 100
      services:
        - name: renovate-operator
          port: 8082
    - match: Host(`renovate.orleans.io`)
      kind: Rule
      services:
        - name: renovate-operator
          port: 8081
  tls:
    secretName: wildcard-orleans-io
