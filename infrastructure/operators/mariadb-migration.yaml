---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-operator-migration
  namespace: mariadb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mariadb-operator-migration
rules:
  - apiGroups:
      - helm.mariadb.mmontes.io
    resources:
      - mariadboperators
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mariadb-operator-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mariadb-operator-migration
subjects:
  - kind: ServiceAccount
    name: mariadb-operator-migration
    namespace: mariadb-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-operator-migration-finalizer-v2
  namespace: mariadb-operator
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: mariadb-operator-migration
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.33.4
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
          args:
            - patch
            - mariadboperators.helm.mariadb.mmontes.io
            - mariadb-operator
            - --namespace=operators
            - --request-timeout=30s
            - --type=merge
            - --patch={"metadata":{"finalizers":[]}}
